<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Hand Duel</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        color: #fff;
        touch-action: none;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      video {
        display: none;
      }
      .hud {
        position: fixed;
        text-shadow: 0 1px 3px #000;
        user-select: none;
      }
      #hp-me,
      #hp-foe {
        top: 14px;
        width: 38vw;
        height: 14px;
        border: 1px solid #fff5;
        border-radius: 7px;
        overflow: hidden;
        background: #0008;
      }
      #hp-me {
        left: 16px;
      }
      #hp-foe {
        right: 16px;
        transform: scaleX(-1);
      }
      .hud .bar {
        height: 100%;
        background: linear-gradient(90deg, #3fd26b, #b7f24a);
        transition: width 0.25s;
      }
      #hp-foe .bar {
        background: linear-gradient(90deg, #f2544a, #d23f9a);
      }
      #status {
        left: 16px;
        bottom: 14px;
        opacity: 0.8;
      }
      #spell {
        right: 16px;
        bottom: 14px;
        font-weight: 700;
        font-size: 16px;
      }
      #join {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        justify-content: center;
        background: #000c;
      }
      #join input,
      #join button {
        font: inherit;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #fff4;
        background: #111;
        color: #fff;
      }
      #join button {
        cursor: pointer;
        background: #2a4dd7;
        border: none;
        font-weight: 700;
      }
      #join .row {
        display: flex;
        gap: 8px;
      }
      #ko {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        font-weight: 800;
        text-shadow: 0 2px 24px #000;
        background: #0006;
      }
    </style>
  </head>
  <body>
    <video id="video" playsinline muted></video>
    <canvas id="gl"></canvas>
    <div class="hud" id="hp-me"><div class="bar" style="width: 100%"></div></div>
    <div class="hud" id="hp-foe"><div class="bar" style="width: 100%"></div></div>
    <div class="hud" id="status">…</div>
    <div class="hud" id="spell"></div>
    <div id="ko"></div>
    <div id="join">
      <h1>Hand Duel</h1>
      <div class="row">
        <input id="room" placeholder="код комнаты" autocomplete="off" />
        <button id="go">Играть</button>
      </div>
      <button id="create">Создать комнату</button>
      <div id="hint">
        ✊ файербол · ✌ лёд · 🤟 шторм · 👍 хил · 👆 болт · ✋ щит · 🤲 рамка двумя руками — портал
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
